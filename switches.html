<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>Attacking the switch · Coaching board</title>
<link rel="stylesheet" href="switches.css">
<script defer src="five-twice.js"></script><script defer src="switch-frames.js"></script><script defer src="hunt-rotation.js"></script><script defer src="cluj-stagger.js?v=finish1"></script><script defer src="court.js?v=stagger1"></script><script defer src="switches.js?v=stagger1"></script>
</head>
<body>
<header><div class="wrap bar"><a class="brand" href="coach.html"><span class="logo" aria-hidden="true">CO</span> Coaching playbook</a><button id="share">Share this beat</button></div></header>
<main class="wrap">
<h1>Attacking the switch</h1>
<nav id="plays" aria-label="Choose a play"></nav>
<a class="compare-link" href="tenerife.html">Compare the quick pass and the Tenerife dribble →</a>
<div class="layout">
<section aria-label="Play animation">
<div class="tools"><label for="read" id="read-label">Defensive response</label><select id="read"></select></div>
<div class="floor">
<svg id="court" viewBox="-6 -6 512 480" role="img" aria-labelledby="court-title court-desc">
</svg></div>
<div id="controls"><button class="primary" id="play">Play to the read</button><button id="prev">← Back</button><button id="next">Next beat →</button></div>
<div><a id="stagger-finish" hidden href="#stagger/reject/4">Play the stagger finish from this catch →</a></div>
<div id="beats" aria-label="Jump to a beat"></div>
<div class="legend"><span><b class="offkey"></b>Offense</span><span><b class="defkey"></b>Defense</span><span><b class="ballkey"></b>Ball</span></div>
</section>
<aside>
<div class="panel readout" aria-live="polite" aria-atomic="true"><div id="count" class="kicker"></div><h2 id="moment"></h2><p id="cue"></p></div>
<div class="panel instruction"><div class="kicker">Timeout call</div><p id="timeout"></p><div class="kicker">Who to involve</div><p id="matchup"></p></div>
<details class="panel"><summary>Coaching notes &amp; sources</summary><div id="notes"></div></details>
</aside></div>
<div id="sharing" role="status"></div>
<noscript>Enable JavaScript to play the animated court.</noscript>
</main></body></html>
